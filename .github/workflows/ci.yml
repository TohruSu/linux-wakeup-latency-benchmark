name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            python: "3.10"
          - compiler: clang
            python: "3.11"
          - compiler: gcc
            python: "3.12"
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional plotting dependency
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-plot.txt matplotlib==3.10.8
      - name: Build and test
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: make CC=${{ matrix.compiler }} PYTHON=python test
      - name: Check AddressSanitizer and UndefinedBehaviorSanitizer
        if: matrix.compiler == 'gcc' && matrix.python == '3.12'
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: make CC=gcc PYTHON=python sanitize
